name: Generate and Update APT Repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to fetch .deb from (leave blank for latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-apt:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Check out code
        uses: actions/checkout@v4


      # ============================================================
      # GIT IDENTITY
      # ============================================================

      - name: Set up Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"


      # ============================================================
      # IMPORT EXISTING GPG KEY
      # ============================================================

      - name: Import GPG Private Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}


      # ============================================================
      # INSTALL APT TOOLS
      # ============================================================

      - name: Install APT Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils


      # ============================================================
      # DETERMINE RELEASE TAG
      # ============================================================

      - name: Determine Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          INPUT_TAG="${{ github.event.inputs.tag }}"

          if [ -z "$INPUT_TAG" ]; then
            TAG="$(gh release view --json tagName --jq '.tagName')"
          else
            TAG="$INPUT_TAG"
          fi

          echo "Using release tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD DEB TEMPORARILY
      #
      # The package is already stored in the GitHub Release.
      # We only download it temporarily so dpkg-scanpackages
      # can inspect its metadata.
      # ============================================================

      - name: Download .deb from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir -p all-dist

          echo "Downloading .deb from release: $TAG"

          gh release download "$TAG" \
            --pattern "*_amd64.deb" \
            --dir all-dist \
            || gh release download "$TAG" \
            --pattern "*.deb" \
            --dir all-dist

          echo ""
          echo "Downloaded packages:"

          find all-dist \
            -type f \
            -name "*.deb" \
            -printf '%f\n'


      # ============================================================
      # GENERATE APT METADATA
      # ============================================================

      - name: Generate APT Metadata
        env:
          GPG_KEY_ID: "DD3569D42FE4D492"
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

        run: |
          set -e

          echo "Creating APT repository..."

          mkdir -p repo/pool/main
          mkdir -p repo/dists/stable/main/binary-amd64


          # ========================================================
          # COPY DEB TEMPORARILY
          # ========================================================

          find all-dist \
            -type f \
            -name "*.deb" \
            -exec cp {} repo/pool/main/ \;


          # ========================================================
          # GENERATE PACKAGES
          # ========================================================

          echo "Generating Packages..."

          dpkg-scanpackages \
            repo/pool/main \
            /dev/null \
            > repo/dists/stable/main/binary-amd64/Packages


          # ========================================================
          # VERIFY DEB
          # ========================================================

          DEB_FILE="$(
            find repo/pool/main \
              -maxdepth 1 \
              -type f \
              -name "*.deb" \
              -printf '%f\n' \
              | head -n 1
          )"

          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: No .deb package found."
            exit 1
          fi

          echo "Package: $DEB_FILE"


          # ========================================================
          # IMPORTANT:
          #
          # DO NOT put a GitHub URL in Filename.
          #
          # APT expects:
          #
          # Filename: pool/main/package.deb
          #
          # The proxy at repo.fluxnotes.nishantapps.in will handle
          # this path and fetch the actual GitHub Release asset.
          # ========================================================

          echo ""
          echo "APT Filename will remain repository-relative."

          grep "^Filename:" \
            repo/dists/stable/main/binary-amd64/Packages


          # ========================================================
          # COMPRESS PACKAGES
          # ========================================================

          echo ""
          echo "Creating Packages.gz..."

          gzip -kf \
            repo/dists/stable/main/binary-amd64/Packages


          # ========================================================
          # REMOVE DEB FROM PUBLISHED REPOSITORY
          #
          # The package stays on GitHub Releases.
          # ========================================================

          rm -rf repo/pool


          # ========================================================
          # GENERATE RELEASE
          # ========================================================

          echo ""
          echo "Generating Release..."

          apt-ftparchive release \
            repo/dists/stable/ \
            > repo/dists/stable/Release


          # ========================================================
          # CONFIGURE GPG
          # ========================================================

          echo ""
          echo "Configuring GPG..."

          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          cat > "$HOME/.gnupg/gpg.conf" <<'EOF'
          batch
          pinentry-mode loopback
          EOF

          cat > "$HOME/.gnupg/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          EOF

          gpgconf --kill gpg-agent || true


          # ========================================================
          # VERIFY EXISTING GPG KEY
          # ========================================================

          echo ""
          echo "Signing with GPG key: $GPG_KEY_ID"

          gpg \
            --batch \
            --list-secret-keys \
            --keyid-format LONG \
            "$GPG_KEY_ID"


          # ========================================================
          # CREATE Release.gpg
          # ========================================================

          echo ""
          echo "Creating Release.gpg..."

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" \
            --armor \
            --detach-sign \
            --output repo/dists/stable/Release.gpg \
            repo/dists/stable/Release


          # ========================================================
          # CREATE InRelease
          # ========================================================

          echo ""
          echo "Creating InRelease..."

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" \
            --clearsign \
            --output repo/dists/stable/InRelease \
            repo/dists/stable/Release


          # ========================================================
          # CLEAN TEMPORARY FILES
          # ========================================================

          rm -rf all-dist


          echo ""
          echo "APT metadata generated successfully."

          echo ""
          echo "Final APT repository:"

          find repo \
            -type f \
            -printf '%p\n'


      # ============================================================
      # PUBLISH TO GH-PAGES
      # ============================================================

      - name: Publish APT Repository
        run: |
          set -e

          echo "Preparing GitHub Pages..."


          # ========================================================
          # SAVE GENERATED REPOSITORY
          # ========================================================

          TEMP_REPO="$(mktemp -d)"

          cp -r repo/. "$TEMP_REPO/"


          # ========================================================
          # PUBLIC GPG KEY
          # ========================================================

          if [ -f public.key ]; then
            cp public.key "$TEMP_REPO/public.key"
          else
            echo "WARNING: public.key was not found."
          fi


          # ========================================================
          # CNAME
          # ========================================================

          echo "repo.fluxnotes.nishantapps.in" \
            > "$TEMP_REPO/CNAME"


          # ========================================================
          # CLEAN WORKING TREE
          # ========================================================

          rm -rf repo


          # ========================================================
          # SWITCH TO GH-PAGES
          # ========================================================

          git checkout --orphan gh-pages

          git rm -rf . || true

          git clean -fdx


          # ========================================================
          # COPY APT METADATA
          # ========================================================

          cp -r "$TEMP_REPO"/. .


          # ========================================================
          # SAFETY CHECK
          # ========================================================

          echo ""
          echo "Checking for Debian packages..."

          if find . \
            -type f \
            -name "*.deb" \
            -not -path './.git/*' \
            | grep -q .; then

            echo "ERROR: A .deb file was found in gh-pages."

            find . \
              -type f \
              -name "*.deb" \
              -not -path './.git/*'

            exit 1
          fi


          echo ""
          echo "Checking for files larger than 100 MB..."

          LARGE_FILES="$(
            find . \
              -type f \
              -size +100M \
              -not -path './.git/*'
          )"

          if [ -n "$LARGE_FILES" ]; then
            echo "ERROR: Files larger than 100 MB detected:"
            echo "$LARGE_FILES"
            exit 1
          fi


          # ========================================================
          # SHOW FINAL FILES
          # ========================================================

          echo ""
          echo "Files being published:"

          find . \
            -type f \
            -not -path './.git/*' \
            -printf '%p\n'


          # ========================================================
          # COMMIT
          # ========================================================

          git add .

          git commit \
            -m "Update APT repository for $TAG"


          # ========================================================
          # PUSH
          # ========================================================

          git push origin gh-pages --force


          echo ""
          echo "=========================================="
          echo "APT repository published successfully!"
          echo "=========================================="
