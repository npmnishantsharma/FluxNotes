name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
            artifact_name: linux
          - os: windows-latest
            flag: --win
            artifact_name: windows
          - os: macos-latest
            flag: --mac
            artifact_name: macos

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build:next

      - name: Run Electron Builder (No Auto-Publish)
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact_name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: all-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-apt-repo:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }} # Leave blank if your key has no passphrase

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Generate APT Metadata
        run: |
          mkdir -p repo/pool/main repo/dists/stable/main/binary-amd64
          
          # Only copy the amd64 .deb file to match binary-amd64 architecture
          find all-dist -name "*_amd64.deb" -exec cp {} repo/pool/main/ \;

          cd repo
          # Scan packages and build index files
          dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file
          apt-ftparchive release dists/stable/ > dists/stable/Release

          # Sign the Release file
          cd dists/stable
          KEY_ID="$(gpg --list-secret-keys --with-colons | grep sec | cut -d':' -f5)"
          gpg --default-key "$KEY_ID" --batch --yes --pinentry-mode loopback -abs -o Release.gpg Release
          gpg --default-key "$KEY_ID" --batch --yes --pinentry-mode loopback --clearsign -o InRelease Release

      - name: Commit and Push to GitHub Pages Branch
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r repo/* .
          
          # Sets custom domain for GitHub Pages
          echo "repo.fluxnotes.nishantapps.in" > CNAME
          
          # Ensures public.key is carried over if you have it in your root folder
          [ -f ../public.key ] && cp ../public.key ./public.key || true
          
          git add .
          git commit -m "Update APT repo for tag ${{ github.ref_name }}"
          git push origin gh-pages --force
          
